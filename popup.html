<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TubePilot</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <header class="panel__header">
        <span class="brand__mark" aria-hidden="true">
          <span class="brand__play"></span>
        </span>
        <span>
          <h1 class="panel__title">TubePilot</h1>
          <p class="panel__subtitle">Controle rapide YouTube</p>
        </span>
      </header>

      <section class="panel__section panel__section--primary">
        <label class="row">
          <span>
            <span class="row__label">Videos deja vues</span>
            <span class="row__meta">Cache ou grise selon le mode actif</span>
          </span>
          <span class="toggle">
            <input id="toggle-enabled" type="checkbox" />
            <span class="toggle__track" aria-hidden="true"></span>
          </span>
        </label>
      </section>

      <section class="panel__section">
        <label class="row row--stack" for="threshold-slider">
          <span class="row__label">
            Seuil de masquage
            <span id="threshold-value" class="slider__value">80%</span>
          </span>
          <input
            id="threshold-slider"
            class="slider"
            type="range"
            min="0"
            max="1"
            step="0.01"
            value="0.8"
          />
        </label>
        <p class="hint">Considere une video vue quand la barre rouge depasse ce seuil.</p>
      </section>

      <section class="panel__section">
        <label class="row">
          <span>
            <span class="row__label">Masquer les Shorts</span>
            <span class="row__meta">Retire les blocs Shorts de YouTube</span>
          </span>
          <span class="toggle">
            <input id="toggle-shorts" type="checkbox" />
            <span class="toggle__track" aria-hidden="true"></span>
          </span>
        </label>
      </section>

      <section class="panel__section">
        <label class="row">
          <span>
            <span class="row__label">Mode debug</span>
            <span class="row__meta">Affiche le pourcentage detecte</span>
          </span>
          <span class="toggle">
            <input id="toggle-debug" type="checkbox" />
            <span class="toggle__track" aria-hidden="true"></span>
          </span>
        </label>
      </section>

      <section class="panel__section">
        <label class="row row--stack" for="select-grid-size">
          <span>
            <span class="row__label">Videos par ligne</span>
            <span class="row__meta">Grille d'accueil</span>
          </span>
          <select id="select-grid-size" class="select">
            <option value="4">4</option>
            <option value="5">5</option>
            <option value="6">6</option>
            <option value="7">7</option>
            <option value="8">8</option>
          </select>
        </label>
      </section>

      <section class="panel__section panel__section--footer">
        <button id="reset-settings" class="button" type="button">
          Reinitialiser
        </button>
      </section>

      <footer class="footer">
        <a
          class="footer__link"
          href="https://github.com/tmaurie/yt-hide-watched"
          target="_blank"
          rel="noreferrer"
        >
          GitHub
        </a>
      </footer>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
